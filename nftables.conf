#!/usr/sbin/nft -f
flush ruleset

table inet filter {

    set ia_blocklist {
        type ipv4_addr
        flags dynamic, timeout
        timeout 1h
        comment "Gestionado por ai_firewall.py"
    }

    set whitelist {
        type ipv4_addr
        flags interval
        elements = {
            127.0.0.1,
            192.168.10.20
        }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        iif enp0s3 ct state established, related accept
        ip saddr @whitelist accept
        ip saddr @ia_blocklist counter drop
        ct state established, related accept
        ct state invalid drop
        tcp dport 22 ct state new limit rate 5/minute accept
        tcp dport { 80, 443 } accept
        tcp dport 5000 ip saddr 192.168.10.0/24 accept
        udp dport 53 accept
        tcp dport 53 accept
        icmp type echo-request limit rate 5/second accept
        log prefix "NFT-DROP: "
        drop
    }

    chain forward {
        type filter hook forward priority 0; policy accept;

        ip saddr @ia_blocklist counter drop
        ct state established, related accept
        iif enp0s8 oif enp0s3 accept
        iif enp0s3 oif enp0s8 ct state established, related accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        oif enp0s3 masquerade
    }
}
